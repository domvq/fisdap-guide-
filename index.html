<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEMT Advanced Case Trainer — Level III</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap');
:root {
  --bg:#080a0e;--surface:#0d1117;--surface2:#131920;--border:#1c2535;--border2:#243040;
  --red:#e8392a;--red-dim:rgba(232,57,42,0.12);--amber:#f59e0b;--amber-dim:rgba(245,158,11,0.1);
  --green:#10b981;--green-dim:rgba(16,185,129,0.1);--blue:#3b82f6;--blue-dim:rgba(59,130,246,0.08);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.1);
  --teal:#14b8a6;--teal-dim:rgba(20,184,166,0.1);
  --rose:#f43f5e;--rose-dim:rgba(244,63,94,0.1);
  --cyan:#06b6d4;--cyan-dim:rgba(6,182,212,0.1);
  --indigo:#6366f1;--indigo-dim:rgba(99,102,241,0.1);
  --text:#94a3b8;--text-bright:#e2e8f0;--dim:#334155;--dim2:#475569;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:22px 18px 60px;max-width:800px;margin:0 auto;position:relative;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;}
header{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.logo{width:34px;height:34px;flex-shrink:0;background:var(--case-color, var(--red));clip-path:polygon(35% 0%,65% 0%,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0% 65%,0% 35%,35% 35%);animation:hb 2.4s ease-in-out infinite;}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(0.9)}}
.header-text h1{font-weight:800;font-size:1.1rem;color:var(--text-bright);}
.header-text p{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--dim2);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
/* HOME */
.home-hero{text-align:center;padding:16px 0 28px;}
.home-hero h2{font-size:1.9rem;font-weight:800;color:var(--text-bright);margin-bottom:10px;line-height:1.2;}
.home-hero h2 span{color:var(--red);}
.home-hero p{color:var(--dim2);font-family:'DM Mono',monospace;font-size:0.78rem;letter-spacing:0.5px;line-height:1.75;max-width:460px;margin:0 auto 26px;}
.btn-primary{background:var(--case-color, var(--red));border:none;color:#fff;padding:12px 30px;border-radius:6px;font-family:'Syne',sans-serif;font-weight:700;font-size:0.88rem;letter-spacing:0.5px;cursor:pointer;transition:all 0.2s;}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--dim2);padding:12px 22px;border-radius:6px;font-family:'Syne',sans-serif;font-weight:600;font-size:0.83rem;cursor:pointer;transition:all 0.2s;}
.btn-ghost:hover{border-color:var(--text);color:var(--text-bright);}
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-top:24px;}
.case-tile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:15px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.case-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--tile-accent);transform:scaleX(0);transform-origin:left;transition:transform 0.25s;}
.case-tile:hover{border-color:var(--border2);background:var(--surface2);}
.case-tile:hover::before{transform:scaleX(1);}
.ct-num{font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--dim2);letter-spacing:3px;text-transform:uppercase;margin-bottom:7px;}
.ct-name{font-weight:700;font-size:0.88rem;color:var(--text-bright);line-height:1.3;margin-bottom:7px;}
.ct-meta{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--dim2);}
.ct-badge{display:inline-block;margin-top:7px;background:var(--badge-bg);border:1px solid var(--badge-border);color:var(--badge-color);font-family:'DM Mono',monospace;font-size:0.52rem;padding:2px 7px;border-radius:3px;letter-spacing:1px;}
/* CASE */
.score-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--dim2);}
.score-val{color:var(--green);font-size:0.92rem;}
.back-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--dim2);padding:5px 11px;border-radius:4px;font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:1px;cursor:pointer;transition:all 0.2s;}
.back-btn:hover{border-color:var(--text);color:var(--text);}
.dispatch-box{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--case-color, var(--amber));border-radius:6px;padding:15px 17px;margin-bottom:16px;animation:fadeUp 0.4s ease;}
.db-label{font-family:'DM Mono',monospace;font-size:0.56rem;letter-spacing:3px;color:var(--dim2);text-transform:uppercase;margin-bottom:7px;}
.dispatch-box p{font-family:'DM Mono',monospace;font-size:0.8rem;color:var(--case-color, var(--amber));line-height:1.75;}
.vitals-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.vital-chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:'DM Mono',monospace;text-align:center;min-width:74px;flex:1;}
.vc-lbl{font-size:0.53rem;color:var(--dim2);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px;}
.vc-val{font-size:0.97rem;font-weight:500;color:var(--text-bright);}
.vital-chip.v-alert{border-color:rgba(232,57,42,0.35);}
.vital-chip.v-alert .vc-val{color:var(--red);animation:flash 1.8s infinite;}
.vital-chip.v-warn .vc-val{color:var(--amber);}
.vital-chip.v-ok .vc-val{color:var(--green);}
@keyframes flash{0%,100%{opacity:1}50%{opacity:0.5}}
.progress-row{display:flex;gap:4px;margin-bottom:18px;}
.prog-seg{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background 0.4s;}
.prog-seg.done{background:var(--green);}
.prog-seg.active{background:var(--case-color, var(--amber));}
.step-meta{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.sm-label{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--case-color, var(--amber));letter-spacing:2px;text-transform:uppercase;}
.sm-type{font-family:'DM Mono',monospace;font-size:0.55rem;padding:2px 7px;border-radius:3px;letter-spacing:1px;text-transform:uppercase;}
.sm-type.mc{background:var(--blue-dim);border:1px solid rgba(59,130,246,0.2);color:var(--blue);}
.sm-type.fr{background:var(--purple-dim);border:1px solid rgba(167,139,250,0.2);color:var(--purple);}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:13px;animation:fadeUp 0.35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-card h2{font-size:0.98rem;font-weight:700;color:var(--text-bright);line-height:1.6;margin-bottom:16px;}
.options-grid{display:grid;gap:8px;}
.opt-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:12px 15px;border-radius:6px;cursor:pointer;font-family:'Syne',sans-serif;font-size:0.86rem;text-align:left;transition:all 0.18s;line-height:1.45;}
.opt-btn:hover:not(:disabled){border-color:var(--case-color, var(--blue));color:var(--text-bright);background:var(--case-dim, var(--blue-dim));}
.opt-btn.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);}
.opt-btn.wrong{border-color:var(--red);background:var(--red-dim);color:#f87171;}
.opt-btn:disabled{cursor:default;}
.fr-area{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:13px 15px;color:var(--text-bright);font-family:'DM Mono',monospace;font-size:0.83rem;line-height:1.7;resize:vertical;min-height:115px;outline:none;transition:border-color 0.2s;}
.fr-area:focus{border-color:var(--case-color, rgba(167,139,250,0.5));}
.fr-area::placeholder{color:var(--dim2);}
.fr-hint{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--dim2);margin-top:7px;letter-spacing:0.5px;}
.submit-fr-btn{margin-top:13px;background:var(--case-dim, var(--purple-dim));border:1px solid var(--case-border, rgba(167,139,250,0.35));color:var(--case-color, var(--purple));padding:11px 22px;border-radius:6px;font-family:'Syne',sans-serif;font-weight:700;font-size:0.83rem;cursor:pointer;transition:all 0.2s;}
.submit-fr-btn:hover:not(:disabled){opacity:0.85;}
.submit-fr-btn:disabled{opacity:0.5;cursor:wait;}
.feedback-box{margin-top:14px;padding:15px;border-radius:6px;font-size:0.86rem;line-height:1.7;animation:fadeUp 0.3s ease;}
.fb-correct{background:var(--green-dim);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;}
.fb-wrong{background:var(--red-dim);border:1px solid rgba(232,57,42,0.25);color:#fca5a5;}
.fb-partial{background:var(--amber-dim);border:1px solid rgba(245,158,11,0.25);color:#fcd34d;}
.fb-loading{background:var(--surface2);border:1px solid var(--border2);color:var(--dim2);}
.feedback-box strong{display:block;margin-bottom:5px;font-size:0.92rem;color:var(--text-bright);}
.ai-dot-row{display:flex;align-items:center;gap:7px;font-family:'DM Mono',monospace;font-size:0.72rem;}
.ai-dot{width:5px;height:5px;border-radius:50%;background:var(--case-color, var(--purple));animation:p2 1s infinite;}
.ai-dot:nth-child(2){animation-delay:.2s}.ai-dot:nth-child(3){animation-delay:.4s}
@keyframes p2{0%,100%{opacity:.3}50%{opacity:1}}
.next-btn{margin-top:13px;background:var(--case-color, var(--red));border:none;color:#fff;padding:11px 24px;border-radius:6px;font-family:'Syne',sans-serif;font-weight:700;font-size:0.83rem;cursor:pointer;transition:all 0.2s;}
.next-btn:hover{opacity:0.9;}
/* END */
.end-card{text-align:center;padding:28px 14px;animation:fadeUp 0.5s ease;}
.end-card h2{font-size:1.5rem;font-weight:800;color:var(--text-bright);margin-bottom:7px;}
.end-score{font-size:3.2rem;font-weight:800;margin:14px 0 5px;}
.end-grade{font-family:'DM Mono',monospace;font-size:0.78rem;letter-spacing:3px;margin-bottom:18px;}
.end-card p{color:var(--dim2);font-family:'DM Mono',monospace;font-size:0.75rem;line-height:1.7;margin-bottom:22px;}
.btn-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.session-bar{margin-top:20px;text-align:center;font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--dim2);}
@media(max-width:540px){.vitals-row{gap:5px;}.vital-chip{min-width:60px;padding:6px 7px;}.case-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div id="app"></div>
<script>

const CASES=[
// ═══ CASE 1: TENSION PNEUMOTHORAX ═══
{
  id:1,
  name:"Tension Pneumothorax",
  subtitle:"Mile Marker 88 &bull; Thoracic Trauma",
  color:"var(--rose)",
  dimColor:"var(--rose-dim)",
  dispatch:"UNIT 7 — Respond to I-40 eastbound, mile marker 88. Single-vehicle MVA, 45-year-old male driver, restrained, airbags deployed. Significant steering wheel deformity. Patient conscious but in extreme distress. ETA: 6 min.",
  vitals:[{l:"HR",v:"136",s:"v-alert"},{l:"BP",v:"82/58",s:"v-alert"},{l:"SpO₂",v:"78%",s:"v-alert"},{l:"RR",v:"36",s:"v-alert"},{l:"GCS",v:"12",s:"v-warn"}],
  steps:[
    {type:"mc",label:"MOI Assessment",q:"You note significant steering wheel deformity and dashboard intrusion. The patient is clutching his right chest. Which pattern of injuries must you immediately suspect?",
    opts:["Traumatic brain injury only — head hit the airbag","Rib fractures, pneumothorax, hemothorax, pulmonary contusion, aortic injury from blunt anterior chest trauma","Lumbar spine fracture — torso compression against seatbelt","Abdominal organ injury only — steering wheels strike the abdomen"],
    correct:1,
    fb:{c:"Correct. Steering wheel deformity = blunt anterior thoracic force. Your differential must immediately include rib fractures, pneumo/hemothorax, flail chest, pulmonary contusion, and aortic injury. Airbags reduce but do NOT eliminate these injuries. High suspicion drives your entire assessment from this point forward.",
    w:"Incorrect. Steering wheel deformity is a cardinal red flag for blunt thoracic trauma. The differential includes rib fractures, pneumo/hemothorax, flail chest, pulmonary contusion, and aortic injury — ALL of which can be fatal if missed."}},
    {type:"fr",label:"Physical Exam Findings",q:"You auscultate the chest. Breath sounds are ABSENT on the right. Trachea is deviated LEFT. JVD is present. BP is 82/58 and falling. Name the diagnosis, explain the pathophysiology causing each of these three physical findings, and state what will happen if untreated.",
    keyPoints:["tension pneumothorax","air trapping","mediastinal shift","tracheal deviation away from affected side","JVD from impaired venous return","hypotension from compressed heart","absent breath sounds","fatal without needle decompression","obstructive shock"],
    gradingNote:"Full credit requires: correct diagnosis (tension PTX), explanation that trapped air under pressure shifts mediastinum AWAY from affected side (tracheal deviation left = right-sided tension), JVD from superior vena cava compression preventing venous return to heart, hypotension from cardiac compression reducing output. Without decompression = cardiac arrest from obstructive shock."},
    {type:"mc",label:"AEMT Scope — Needle Decompression",q:"Tension pneumothorax is confirmed. At the AEMT level in most jurisdictions, needle thoracostomy (decompression) is:",
    opts:["Within AEMT scope — perform immediately at the 2nd ICS midclavicular line or 4th/5th ICS midaxillary line per protocol","Outside AEMT scope — your role is O₂, rapid transport, and ALS intercept while supporting ABCs","Permitted only if medical direction is physically present on scene","Always performed exclusively by paramedics"],
    correct:0,
    fb:{c:"Correct. Needle thoracostomy is an advanced-level skill within the AEMT and paramedic scope in many modern EMS systems, allowing rapid relief of obstructive shock. Always adhere to your specific local protocols and medical direction. Knowing your scope and executing promptly saves lives.",
    w:"Incorrect. In many advanced systems, needle decompression is within the AEMT scope of practice. Always verify your local protocols, but recognize that tension PTX is an immediate life threat requiring prompt intervention."}},
    {type:"mc",label:"Transport Decision",q:"Nearest ED is 4 minutes away (community hospital, no trauma surgery). Level I Trauma Center is 14 minutes. Which do you choose and why?",
    opts:["Community ED — 10 minutes matters more than surgical capability","Level I Trauma Center — this patient needs emergent surgical capability; the 10-minute difference is justified by access to definitive care","Whichever your dispatch recommends, regardless of capabilities","Hover on scene for ALS to arrive before making the transport decision"],
    correct:1,
    fb:{c:"Correct. This is the 'right patient, right hospital' principle. Tension PTX requiring decompression + potential hemothorax + aortic injury cannot be managed at a community ED without trauma surgery. Pre-notify the Level I center, request ALS intercept en route — the extra 10 minutes is worth it for definitive care.",
    w:"Incorrect. 'Nearest' ≠ 'most appropriate.' A patient with suspected tension PTX, hemothorax, and possible aortic injury requires a Level I Trauma Center with thoracic surgical capability. Delivering a critical trauma patient to a facility that cannot provide definitive care wastes time."}}
  ]
},

// ═══ CASE 2: AORTIC DISSECTION ═══
{
  id:2,
  name:"Aortic Dissection",
  subtitle:"University Blvd &bull; Vascular Emergency",
  color:"var(--amber)",
  dimColor:"var(--amber-dim)",
  dispatch:"UNIT 7 — Respond to 1102 University Blvd. 68-year-old male, history of hypertension and Marfan syndrome. Wife reports sudden 'tearing' pain in chest and back while sitting at his desk. Onset 30 minutes ago. ETA: 5 min.",
  vitals:[{l:"HR",v:"104",s:"v-warn"},{l:"BP-R",v:"182/108",s:"v-alert"},{l:"BP-L",v:"144/84",s:"v-warn"},{l:"SpO₂",v:"95%",s:"v-ok"},{l:"RR",v:"22",s:"v-warn"}],
  steps:[
    {type:"fr",label:"BP Discrepancy",q:"You take blood pressures in both arms: Right arm = 182/108, Left arm = 144/84. The difference is 38 mmHg systolic. Explain what causes this finding, what diagnosis it suggests, and why the distinction from a regular hypertensive emergency matters for your treatment decisions.",
    keyPoints:["aortic dissection","subclavian artery","flap occlusion","unequal BPs","no aspirin","no nitroglycerin","tearing pain","Marfan","hypertension risk factor","different treatment than AMI"],
    gradingNote:"Full credit: the dissection flap can occlude one subclavian artery reducing flow to that arm. This is a hallmark of aortic dissection. Critical distinction: NO aspirin (worsens hemorrhage into false lumen), NO aggressive nitroglycerin without medical control (hypotension is catastrophic in dissection). Treatment = control BP, pain control, rapid transport to vascular-capable center."},
    {type:"mc",label:"Aspirin Decision",q:"Patient reports 10/10 chest and back pain. Should you administer aspirin 324mg?",
    opts:["Yes — all chest pain gets aspirin per protocol","No — aspirin's antiplatelet effect can worsen hemorrhage into the aortic wall or pericardial space; withhold until dissection is ruled out","Yes, but reduce the dose to 81mg as a compromise","Only if the patient specifically asks for it"],
    correct:1,
    fb:{c:"Correct. This is the single most important drug decision in this scenario. Aspirin in aortic dissection can dramatically worsen bleeding into the false lumen or cause hemopericardium and tamponade. When you cannot differentiate AMI from dissection in the field — and unequal BPs + tearing pain strongly suggest dissection — WITHHOLD aspirin. This is a hard rule to memorize: tearing + radiation to back + BP discrepancy = hold the aspirin.",
    w:"Incorrect. Aortic dissection is an absolute contraindication to aspirin. The antiplatelet effect worsens hemorrhage into the false lumen and can precipitate pericardial tamponade. When dissection is suspected, withhold aspirin regardless of the chest pain."}},
    {type:"mc",label:"Nitroglycerin Safety",q:"Patient is hypertensive (182/108) and in severe pain. Your partner suggests NTG to help with both. Your response?",
    opts:["Agree — NTG is the standard for hypertensive chest pain emergencies","Decline — in suspected dissection, NTG-induced hypotension can propagate the dissection and cause cardiovascular collapse; medical control/ALS manages BP with titratable agents","Give NTG only if the patient has a prescription for it","Give NTG but monitor BP every 30 seconds"],
    correct:1,
    fb:{c:"Correct. NTG drops preload rapidly and unpredictably. In aortic dissection, sudden hypotension is catastrophic — perfusion to the brain, heart, and kidneys depends on maintaining adequate pressure. Medical control uses titratable IV agents (like labetalol or esmolol) that can be precisely controlled. AEMT role: O₂ if needed, positioning, calm reassurance (reduces catecholamine surge), rapid transport.",
    w:"Incorrect. NTG is dangerous in suspected aortic dissection. It can cause precipitous hypotension which worsens end-organ perfusion and can extend the dissection. Titratable IV antihypertensives are used in this scenario, not sublingual NTG."}},
    {type:"fr",label:"Patient Communication",q:"The patient grabs your arm and says 'I know something is very wrong with me. Tell me honestly — am I dying?' Write out verbatim what you would say to him. Then explain the clinical rationale for your communication approach.",
    keyPoints:["honest","calm","avoid false reassurance","do not diagnose","focus on action","getting to hospital fast","reassurance through action not words","reduce catecholamine","stress worsens dissection"],
    gradingNote:"Good answer: honest without catastrophizing ('I'm taking what you're feeling very seriously and we are getting you to the best possible help right now'), does NOT give a field diagnosis, conveys urgency through action not panic. Clinical rationale: stress → catecholamine surge → elevated BP → propagates dissection. Calm communication is literally therapeutic in this case. Full credit requires BOTH the verbatim response AND the clinical rationale."}
  ]
},

// ═══ CASE 3: PEDIATRIC MENINGOCOCCEMIA ═══
{
  id:3,
  name:"Pediatric Meningococcemia",
  subtitle:"Birchwood Ct &bull; Pediatric Sepsis",
  color:"var(--purple)",
  dimColor:"var(--purple-dim)",
  dispatch:"UNIT 7 — Respond to 44 Birchwood Ct. Parents called for their 22-month-old son who had a seizure lasting 2 minutes. He has been febrile for 2 days. Now unconscious but breathing. ETA: 4 min.",
  vitals:[{l:"HR",v:"172",s:"v-alert"},{l:"BP",v:"84/52",s:"v-warn"},{l:"SpO₂",v:"93%",s:"v-warn"},{l:"RR",v:"42",s:"v-alert"},{l:"TEMP",v:"104.3°F",s:"v-alert"}],
  steps:[
    {type:"mc",label:"Pediatric Assessment Triangle",q:"Before touching the child, you perform the PAT from the doorway. You see: limp muscle tone, no eye contact, not crying, nasal flaring, and mottled gray skin. How do you classify this patient?",
    opts:["Stable — altered appearance in a febrile child is expected and not immediately concerning","Critically ill — abnormal appearance + increased work of breathing + abnormal circulation to skin = immediate life threat","Moderately ill — transport non-urgently and monitor en route","Unable to classify without touching the patient first"],
    correct:1,
    fb:{c:"Correct. All three PAT limbs are abnormal: Appearance = limp tone, no eye contact, no cry (TICLS abnormal); Work of Breathing = nasal flaring; Circulation to Skin = mottled, gray. This is an immediate life threat. The PAT gives you this critical information before you even touch the child — that's its power.",
    w:"Incorrect. The PAT (Pediatric Assessment Triangle) is your 30-second across-the-room impression. Abnormal Appearance + abnormal Work of Breathing + abnormal Circulation to Skin = immediate life threat. Never minimize signs in a sick child."}},
    {type:"fr",label:"Petechial Rash",q:"You expose the child's trunk and find non-blanching petechiae — small purple-red spots that do NOT turn white when pressed. Describe the blanch test, explain what non-blanching means physiologically, and explain why this finding in a febrile child is a critical emergency beyond a simple febrile seizure.",
    keyPoints:["blanch test","press finger","does not turn white","microthrombi","meningococcemia","Neisseria meningitidis","septicemia","DIC","antibiotics","time critical","mortality","septic emboli","capillary hemorrhage"],
    gradingNote:"Full credit: blanch test = press firmly on skin, normal vessels turn white then refill red; non-blanching = blood OUTSIDE vessels in skin (not changing with pressure) = microhemorrhages from septic emboli blocking microvasculature (DIC). In a febrile child = meningococcemia until proven otherwise. Can progress to limb loss, multi-organ failure, death within hours. Requires emergent antibiotics — every minute matters."},
    {type:"mc",label:"Pediatric Airway Differences",q:"En route the child becomes apneic. Which technique is INCORRECT for OPA insertion in a child vs an adult?",
    opts:["Using a tongue depressor to guide the OPA into position","Inserting the OPA upside down (concave up) and rotating 180° — this is safe in adults but risks palatal injury in children","Sizing from the center of the mouth to the earlobe","Suctioning before airway insertion if secretions are visible"],
    correct:1,
    fb:{c:"Correct. The 180° rotation technique used in adults is contraindicated in children — the soft palate can be lacerated or perforated. In pediatric OPA insertion: use a tongue depressor to guide the airway in directly (concave down), without rotation. Size: corner of mouth to earlobe or center of mouth to angle of jaw. This is a high-yield exam distinction.",
    w:"Incorrect. The adult OPA rotation technique (insert concave up, rotate 180°) is CONTRAINDICATED in children. The pediatric soft palate is delicate and can be severely injured. Use a tongue depressor and insert directly in the correct orientation."}},
    {type:"mc",label:"BVM Ventilation — Pediatric",q:"You begin BVM ventilations on the 22-month-old. Which statement about pediatric BVM technique is MOST accurate?",
    opts:["Use the same tidal volume as an adult — the goal is chest rise regardless of age","Use a pediatric mask and deliver only enough volume to see gentle chest rise — overventilation causes gastric distension, vomiting, and aspiration","Ventilate at 20–24 breaths per minute to match the child's elevated normal respiratory rate","Pediatric BVM technique is identical to adult — no modifications needed"],
    correct:1,
    fb:{c:"Correct. Pediatric BVM: use an appropriately sized mask for a good seal, deliver SMALL tidal volumes (just enough for visible chest rise — usually 6–8 mL/kg), rate 12–20/min for infants, 10–15 for children. Overventilation causes gastric distension (children have a horizontal stomach), vomiting, aspiration, and vagal-induced bradycardia. Less is more in pediatric airway.",
    w:"Incorrect. Pediatric BVM requires modified technique: smaller tidal volumes (just enough for chest rise), pediatric-sized mask, avoid excess pressure. Overventilation in children causes gastric distension, vomiting, aspiration, and can induce dangerous bradycardia via vagal stimulation."}}
  ]
},

{
  id:4,

  subtitle:"Suncrest Care &bull; Endocrine Emergency",
  color:"var(--teal)",
  dimColor:"var(--teal-dim)",
  dispatch:"UNIT 7 — Respond to Suncrest Care Facility, Room 14. 79-year-old female, Type 2 diabetic. Staff says she has been 'off' for 3 days — barely eating, increasingly confused, not drinking fluids. Now nearly unresponsive. ETA: 5 min.",

    keyPoints:["HHS","hyperglycemic hyperosmolar state","Type 2","residual insulin","no ketones","no Kussmaul","no fruity breath","slow onset","extreme dehydration","Type 1 DKA","ketoacidosis","Kussmaul compensatory","fruity breath acetone","elderly"],
    gradingNote:"Full credit: HHS has residual insulin (Type 2) — enough to prevent fat breakdown/ketogenesis but NOT enough to control glucose. No ketones = no metabolic acidosis = no Kussmaul breathing (which compensates for acidosis) and no fruity acetone breath. DKA = absolute insulin deficiency → fat breakdown → ketones → acidosis → Kussmaul. HHS = extreme hyperglycemia + dehydration, develops over days/weeks, higher mortality than DKA."},
    {type:"mc",label:"Volume Deficit Estimation",q:"A patient with HHS can have a total body water deficit of up to 9–10 liters. Which physical exam findings would you expect from this degree of dehydration?",
    opts:["Moist mucous membranes and good skin turgor — HHS is primarily a glucose problem, not a fluid problem","Dry/cracked mucous membranes, skin tenting with poor turgor, sunken eyes, tachycardia, hypotension, and minimal urine output","Peripheral edema — fluid shifts from intravascular to tissues during hyperglycemia","Normal skin exam — dehydration signs appear only with actual water loss, not glucose elevation"],
    correct:1,
    fb:{c:"Correct. HHS causes profound osmotic diuresis — the extremely high glucose pulls water out of cells and into urine (glucosuria), leading to massive dehydration. Expect: dry/cracked lips and mucous membranes, skin tenting (slow turgor return), sunken eyes, tachycardia as compensation, hypotension, and minimal urine. This patient may have lost nearly 9 liters of fluid over days.",
    w:"Incorrect. HHS produces profound dehydration through osmotic diuresis — glucose in urine pulls enormous amounts of water with it. Classic signs: dry mucous membranes, skin tenting, sunken eyes, tachycardia, hypotension. The fluid deficit is the primary killer in HHS, often exceeding 9 liters."}},
    {type:"mc",label:"AEMT Treatment Priority",q:"BGL 718, BP 96/60, nearly unresponsive. What is the MOST dangerous error in this scenario?",
    opts:["Failing to establish IV access and initiate fluid resuscitation per protocol","Administering oral glucose to a patient with a BGL of 718 because you confused this with hypoglycemia","Not obtaining a 12-lead ECG in the field","Giving supplemental oxygen when SpO₂ is 97%"],
    correct:1,
    fb:{c:"Correct. Administering oral glucose to a hyperglycemic patient is a critical error. BGL of 718 is already dangerously high. Oral glucose would further elevate an already lethal blood sugar. Correct treatment: do NOT give glucose, secure ABCs, position supine (hypotension), initiate IV access and fluid resuscitation per protocol, rapid transport to ED.",
    w:"Incorrect. The most dangerous error is giving oral glucose to a hyperglycemic patient. Always obtain a blood glucose FIRST. Oral glucose = treatment for hypoglycemia (<70 mg/dL) only. BGL of 718 demands the opposite intervention."}},
    {type:"fr",label:"Advance Directives",q:"You cannot locate this patient's advance directives. Nursing staff says 'she has a DNR somewhere but we can't find it.' Her family is not present. Explain your legal and ethical obligations in detail, including what constitutes a valid DNR and how you document this situation.",
    keyPoints:["presume consent","valid DNR must be present","verbal report not valid","full treatment","document absence","POLST","signed by physician","physically present","cannot withhold based on verbal","document in PCR","family not present","no capacity"],
    gradingNote:"Full credit: without a VALID, PHYSICALLY PRESENT advance directive (DNR/POLST signed by physician), you PRESUME CONSENT and provide full treatment. A verbal report from staff does NOT constitute a valid order. Document in your PCR: 'No valid advance directive presented on scene. Staff verbally reported existence of DNR but document was not available. Full treatment provided per protocol.' Legal exposure if you withhold treatment based on verbal reports."}
  ]
},

    correct:1,
    fb:{c:"Correct. Bystander CPR is extremely valuable — don't interrupt it longer than necessary. Your partner dries the chest (water prevents AED adhesion and can cause pad arcing), you take over compressions seamlessly, then analyze with AED ASAP. Time without compressions is time without brain perfusion. Move efficiently, not fast and sloppy.",
    w:"Incorrect. Bystander CPR should be continued with minimal interruption. Take over compressions seamlessly, dry the chest for AED pads, analyze the rhythm. Every second without compressions reduces the chance of neurologically intact survival."}},
    {type:"fr",label:"Drowning Airway Priority",q:"Cardiac arrest from drowning is FUNDAMENTALLY different from a primary cardiac arrest (like VF from AMI). Explain this difference physiologically, and describe how this changes your CPR priority order (compressions vs ventilations) for a drowning patient.",
    keyPoints:["hypoxic arrest","primary hypoxia","oxygen depletion","ventilation priority","cardiac arrest secondary","5 rescue breaths","compression-to-ventilation ratio","airway first","oxygenation primary","unlike VF cardiac","compression-only less effective","O2 deficit"],
    gradingNote:"Full credit: drowning = hypoxic arrest (primary asphyxia / lack of O₂ causes the heart to stop). In primary cardiac arrest, blood is oxygenated initially; in drowning, blood is profoundly deoxygenated before arrest. Priority = ventilation and oxygenation FIRST (e.g., initial rescue breaths / BVM) before or balanced with compressions. Compression-only CPR is inadequate for drowning because the primary insult is respiratory/hypoxic."}

// App State
let currentCase = null;
let currentStep = 0;
let score = 0;
let totalSteps = 0;
let selectedOption = null;
let frAnswer = "";
let feedbackState = null; // null, 'loading', {correct, text}

function renderHome() {
  const app = document.getElementById('app');
  let html = `
    <header style="--case-color: var(--blue);">
      <div class="logo"></div>
      <div class="header-text">
        <h1>AEMT Advanced Case Trainer</h1>
        <p>Dominique Ball &bull; Level III Clinical Simulation</p>
      </div>
    </header>
    <div class="home-hero">
      <h2>Advanced Clinical <span>Simulations</span></h2>
      <p>Select a high-acuity scenario to test diagnostic reasoning, advanced scope decisions, and pathophysiology management.</p>
      <button class="btn-primary" style="--case-color: var(--blue);" onclick="startRandomCase()">Random Case Drill</button>
    </div>
    <div class="case-grid">
  `;

  CASES.forEach((c, idx) => {
    html += `
      <div class="case-tile" style="--tile-accent: ${c.color}; --badge-bg: ${c.dimColor}; --badge-border: ${c.color}; --badge-color: ${c.color};" onclick="startCase(${idx})">
        <div class="ct-num">Case 0${c.id}</div>
        <div class="ct-name">${c.name}</div>
        <div class="ct-meta">${c.subtitle}</div>
        <span class="ct-badge">${c.steps.length} Steps</span>
      </div>
    `;
  });

  html += `</div>`;
  app.innerHTML = html;
}

function startCase(idx) {
  currentCase = CASES[idx];
  currentStep = 0;
  score = 0;
  totalSteps = currentCase.steps.length;
  selectedOption = null;
  frAnswer = "";
  feedbackState = null;
  renderStep();
}

function startRandomCase() {
  const idx = Math.floor(Math.random() * CASES.length);
  startCase(idx);
}

function renderStep() {
  const app = document.getElementById('app');
  const step = currentCase.steps[currentStep];
  const cColor = currentCase.color;
  const cDim = currentCase.dimColor;

  let progHtml = `<div class="progress-row">`;
  for(let i=0; i<totalSteps; i++) {
    let cls = "";
    if(i < currentStep) cls = "done";
    else if(i === currentStep) cls = "active";
    progHtml += `<div class="prog-seg ${cls}" style="--case-color:${cColor};"></div>`;
  }
  progHtml += `</div>`;

  let vitalsHtml = `<div class="vitals-row">`;
  currentCase.vitals.forEach(v => {
    vitalsHtml += `
      <div class="vital-chip ${v.s}">
        <div class="vc-lbl">${v.l}</div>
        <div class="vc-val">${v.v}</div>
      </div>
    `;
  });
  vitalsHtml += `</div>`;

  let interactiveHtml = "";
  if(step.type === 'mc') {
    interactiveHtml = `<div class="options-grid" style="--case-color:${cColor}; --case-dim:${cDim};">`;
    step.opts.forEach((opt, oIdx) => {
      let btnCls = "opt-btn";
      let disabled = "";
      if(feedbackState !== null) {
        disabled = "disabled";
        if(oIdx === step.correct) btnCls += " correct";
        else if(oIdx === selectedOption) btnCls += " wrong";
      }
      interactiveHtml += `<button class="${btnCls}" ${disabled} onclick="selectOption(${oIdx})">${opt}</button>`;
    });
    interactiveHtml += `</div>`;
  } else {
    let disabled = feedbackState !== null ? "disabled" : "";
    let btnDisabled = feedbackState !== null || !frAnswer.trim() ? "disabled" : "";
    interactiveHtml = `
      <div style="--case-color:${cColor}; --case-dim:${cDim}; --case-border:${cColor};">
        <textarea class="fr-area" placeholder="Enter clinical rationale, pathophysiology, and management details..." ${disabled} oninput="updateFr(this.value)">${frAnswer}</textarea>
        <div class="fr-hint">Provide structured clinical reasoning addressing key diagnostic and pathophysiological indicators.</div>
        ${feedbackState === null ? `<button class="submit-fr-btn" ${btnDisabled} onclick="submitFr()">Evaluate Response</button>` : ''}
      </div>
    `;
  }

  let feedbackHtml = "";
  if(feedbackState === 'loading') {
    feedbackHtml = `
      <div class="feedback-box fb-loading" style="--case-color:${cColor};">
        <div class="ai-dot-row">
          Evaluating clinical reasoning<div class="ai-dot" style="background:${cColor};"></div><div class="ai-dot" style="background:${cColor};"></div><div class="ai-dot" style="background:${cColor};"></div>
        </div>
      </div>
    `;
  } else if(feedbackState !== null) {
    let fbClass = feedbackState.isCorrect ? "fb-correct" : "fb-wrong";
    let fbTitle = feedbackState.isCorrect ? "Clinical Evaluation: Correct" : "Clinical Evaluation: Review Required";
    feedbackHtml = `
      <div class="feedback-box ${fbClass}">
        <strong>${fbTitle}</strong>
        ${feedbackState.text}
      </div>
      <button class="next-btn" style="background:${cColor};" onclick="nextStep()">Proceed to Next Step &rarr;</button>
    `;
  }

  app.innerHTML = `
    <header style="--case-color:${cColor};">
      <div class="logo"></div>
      <div class="header-text">
        <h1>${currentCase.name}</h1>
        <p>Case 0${currentCase.id} &bull; Step ${currentStep + 1} of ${totalSteps}</p>
      </div>
    </header>

    <div class="score-row">
      <span>Score: <strong class="score-val">${score}/${totalSteps}</strong></span>
      <button class="back-btn" onclick="renderHome()">Exit to Menu</button>
    </div>

    <div class="dispatch-box" style="--case-color:${cColor};">
      <div class="db-label">Dispatch Information</div>
      <p>${currentCase.dispatch}</p>
    </div>

    ${vitalsHtml}
    ${progHtml}

    <div class="q-card">
      <div class="step-meta">
        <span class="sm-label" style="color:${cColor};">${step.label}</span>
        <span class="sm-type ${step.type}">${step.type === 'mc' ? 'Multiple Choice' : 'Free Response'}</span>
      </div>
      <h2>${step.q}</h2>
      ${interactiveHtml}
    </div>

    ${feedbackHtml}
  `;
}

function selectOption(idx) {
  if(feedbackState !== null) return;
  selectedOption = idx;
  const step = currentCase.steps[currentStep];
  const isCorrect = idx === step.correct;
  if(isCorrect) score++;

  feedbackState = {
    isCorrect: isCorrect,
    text: isCorrect ? step.fb.c : step.fb.w
  };
  renderStep();
}

function updateFr(val) {
  frAnswer = val;
  const btn = document.querySelector('.submit-fr-btn');
  if(btn) {
    if(val.trim().length > 0) btn.removeAttribute('disabled');
    else btn.setAttribute('disabled', 'true');
  }
}

function submitFr() {
  if(!frAnswer.trim() || feedbackState !== null) return;
  feedbackState = 'loading';
  renderStep();

  setTimeout(() => {
    const step = currentCase.steps[currentStep];
    const userText = frAnswer.toLowerCase();
    
    let matchedCount = 0;
    step.keyPoints.forEach(pt => {
      if(userText.includes(pt.toLowerCase())) matchedCount++;
    });

    const threshold = Math.min(2, Math.ceil(step.keyPoints.length / 3));
    const isCorrect = matchedCount >= threshold;
    if(isCorrect) score++;

    let evalText = `Your response incorporated ${matchedCount} of ${step.keyPoints.length} key clinical indicators.<br><br><strong>Clinical Grading Guidance:</strong> ${step.gradingNote}`;

    feedbackState = {
      isCorrect: isCorrect,
      text: evalText
    };
    renderStep();
  }, 1000);
}

function nextStep() {
  currentStep++;
  selectedOption = null;
  frAnswer = "";
  feedbackState = null;

  if(currentStep >= totalSteps) {
    renderEnd();
  } else {
    renderStep();
  }
}

function renderEnd() {
  const app = document.getElementById('app');
  const cColor = currentCase.color;
  let pct = Math.round((score / totalSteps) * 100);
  let grade = "LEVEL III CERTIFIED";
  let gradeColor = "var(--green)";
  if(pct < 70) {
    grade = "NEEDS REMEDIATION";
    gradeColor = "var(--red)";
  } else if(pct < 90) {
    grade = "PROFICIENT";
    gradeColor = "var(--amber)";
  }

  app.innerHTML = `
    <header style="--case-color:${cColor};">
      <div class="logo"></div>
      <div class="header-text">
        <h1>Simulation Complete</h1>
        <p>Dominique Ball &bull; AEMT Case Trainer</p>
      </div>
    </header>

    <div class="end-card">
      <h2>Case Debrief: ${currentCase.name}</h2>
      <div class="end-score" style="color:${gradeColor};">${pct}%</div>
      <div class="end-grade" style="color:${gradeColor};">${grade}</div>
      <p>Final Score: ${score} / ${totalSteps} correct decisions.<br>Your clinical management report has been logged successfully.</p>
      <div class="btn-row">
        <button class="btn-primary" style="background:${cColor};" onclick="startCase(currentCase.id - 1)">Retake Case</button>
        <button class="btn-ghost" onclick="renderHome()">Return to Menu</button>
      </div>
    </div>
  `;
}

// Initial load
renderHome();

</script>
</body>
</html>
